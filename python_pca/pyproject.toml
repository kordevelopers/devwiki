[project]
name = "hynix-tas-python-pca"
version = "0.1.0"
description = "Oracle/ODBC PCA and KNN analysis runner for Hynix TAS."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "oracledb>=2.4",
    "pandas>=2.2",
    "pyodbc>=5.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "SQLAlchemy>=2.0",
]

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
